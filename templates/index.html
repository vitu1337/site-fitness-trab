{% extends 'base.html' %}

{% block content %}
<div class="hero">
    <h1>Bem-vindo ao Portal Saúde & Fit</h1>
    <p>Acompanhe métricas corporais e faça cálculos rapidamente.</p>
</div>

<div class="grid">
    <div class="box">
        <h3>Cálculos Matemáticos</h3>
        <form action="{{ url_for('calcular_math') }}" method="POST">
            <label>Operação</label>
            <select name="operacao">
                <option value="soma">Soma (+)</option>
                <option value="subtracao">Subtração (-)</option>
                <option value="multiplicacao">Multiplicação (×)</option>
                <option value="divisao">Divisão (÷)</option>
            </select>

            <label>Primeiro valor</label>
            <input type="number" name="num1" required>

            <label>Segundo valor</label>
            <input type="number" name="num2" required>

            <button type="submit" class="btn">Calcular</button>
        </form>
    </div>

    <div class="box">
        <h3>Calculadora IMC</h3>
        <p style="font-size: 12px; color: #666;">Calcule o seu índice de massa corporal.</p>
        
        <form action="{{ url_for('calcular_imc') }}" method="POST">
            <label>Peso (kg)</label>
            <input type="number" step="0.1" name="peso" placeholder="Ex: 66,0" required>

            <label>Altura (m)</label>
            <input type="number" step="0.01" name="altura" placeholder="Ex: 1,76" required>

            <label>Sexo</label>
            <select name="sexo">
                <option value="Outro">Outro</option>
                <option value="Masculino">Masculino</option>
                <option value="Feminino">Feminino</option>
            </select>

            <label>Idade</label>
            <input type="number" name="idade" placeholder="Ex: 25" value="25" required>

            <button type="submit" class="btn">Ir para a Calculadora</button>
        </form>
    </div>
</div>
{% endblock %}
